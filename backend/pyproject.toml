[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vulnscanner"
version = "0.1.0"
description = "Production-oriented vulnerability assessment platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "pydantic[email]>=2.7.4",
    "pydantic-settings>=2.3.0",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.9.0",
    "redis>=5.0.7",
    "rq>=1.16.2",
    "python-multipart>=0.0.9",
    "structlog>=24.2.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.4",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "pytest-env>=1.1.3",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "factory-boy>=3.3.0",
    "freezegun>=1.5.1",
]
reporting = [
    "weasyprint>=62.3",
]
postgres = ["psycopg2-binary>=2.9.9"]
llm = ["anthropic>=0.40,<1", "openai>=1.40,<3"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S"]
ignore = [
    "S101",   # allow assert in tests
    "S105",   # allow hardcoded password in tests
    "B008",   # allow function calls in default args (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = false
