server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # The API accepts JSON bodies only; nothing large is uploaded.
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Scan event stream (SSE). Regex locations match in order, so this one must stay
    # above the general API location. Streams are unbuffered and may stay open for the
    # length of a scan; the browser reconnects and the API replays missed events.
    location ~ ^/api/v1/organizations/[^/]+/scans/[^/]+/events$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API trusts a fixed number of proxy hops (TRUSTED_PROXY_HOPS); nginx appends one.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3900s;
        proxy_send_timeout 3900s;

        # See the general API location: these two are set here once, and the API's
        # own Referrer-Policy passes through.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    # The health, profiles, and tool status endpoints live outside /api/v1.
    # Report downloads stay on the same origin as the console so session cookies apply.
    location ~ ^/(api/|system/|health(?:/|$)|scan-profiles$|docs(?:/|$)|redoc$|openapi\.json$) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Remediation requests wait on an LLM and can take minutes.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # X-Frame-Options and X-Content-Type-Options are set here once (the API's
        # copies are dropped). Because this location has its own add_header lines,
        # the server-level Referrer-Policy is not inherited: the API's own value
        # passes through, so report downloads keep their no-referrer policy.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    location ~ /\. {
        deny all;
    }

    # Browser test harness and fixtures share the mounted frontend directory.
    location ^~ /tests/ {
        return 404;
    }

    # SPA routing - fallback to index.html. The CSP applies only to the console (it
    # matches the API's console policy): the API docs pages load Swagger UI from a CDN.
    # A location that sets headers does not inherit the server-level ones, so they are
    # repeated here. no-cache makes browsers revalidate so a deploy takes effect at once.
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
